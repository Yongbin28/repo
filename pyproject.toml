[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wafer-quality-gate"
version = "1.0.0"
description = "Wafer Quality Gate Data Preparation Pipeline"
requires-python = ">=3.8"
dependencies = [
    "streamlit>=1.30.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "xgboost>=2.0.0",
    "catboost>=1.2.0",
    "lightgbm>=4.1.0",
    "plotly>=5.18.0",
    "openpyxl>=3.1.2",
    "selenium>=4.1.0",
    "playwright>=1.40.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0",
    "isort>=5.10",
    "mypy>=1.0",
]

[tool.black]
line-length = 100
target-version = ['py38']
